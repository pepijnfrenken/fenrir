# MiniCPM5-1B — local family-comparison campaign config.
# Model: openbmb/MiniCPM5-1B (dense LlamaForCausalLM, 24 layers, hidden 1536,
# bf16, chat template with thinking markers). Weights on disk
# (models/minicpm5-1b-base); edited dirs: models/huihui-minicpm5-1b-abliterated,
# models/sahilchachra-minicpm5-1b-uncensored.
# model_id resolves via a repo-root symlink (absolver/MiniCPM5-1B -> ../models/minicpm5-1b-base).
model_id: "MiniCPM5-1B"
model_arch: "dense"
dtype: "bfloat16"
device: "auto"
trust_remote_code: false
n_directions: 3
n_probe_prompts: 40
n_verify_prompts: 40
alpha: 0.5
passes: 1
target_layers: []
target_weights: ["o_proj", "down_proj"]
batch_size: 1
max_seq_len: 2048
prompt_flavor: "chat"
prompt_format: "auto"
separation_threshold: 3.0
ouroboros_threshold: 0.5
max_ouroboros_passes: 2
reflexion_enabled: false
judge_enabled: false
platform: "local"