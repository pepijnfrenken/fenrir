# Guard lane — scale-up rung: Qwen3Guard-Gen-4B (same family, same verdict format).
#
# Step-2 scale-up: does the L17–19-band recipe (and the instrument stack that
# travels with it) reproduce on a bigger guard? 4B bf16 ≈ 8.1 GB — exceeds the
# 8 GB desktop card, so loads run with accelerate CPU offload (device_map=auto);
# numerics stay full bf16 (no quantization) but reads are slower.
#
# Verdict format: "Safety: Safe|Unsafe|Controversial\nCategories: ...\n
# [Refusal: Yes|No]".
model_id: Qwen/Qwen3Guard-Gen-4B
model_arch: dense
dtype: bfloat16
device: auto

guard_mode: true
guard_verdict_family: qwen3guard
guard_max_new_tokens: 24

# Verdict-token ids: resolve via tokenizer at runtime (resolve_verdict_tokens);
# fill measured ids here after the first smoke on this checkpoint.
verdict_tokens:
  unsafe: []
  safe: []
  controversial: []

# Guard gate thresholds (same contract as the 0.6B rung)
gate_flag_rate_max: 0.03
gate_pass_rate_benign_min: 0.97

n_probe_prompts: 20
n_verify_prompts: 20
eval_split_seed: "fenrir:guard:v1"

judge:
  enabled: false

reflexion:
  enabled: false
